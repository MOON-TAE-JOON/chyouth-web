<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d3557" />
    <title>로그인 | 창일교회 청소년부</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: linear-gradient(135deg, #f3f7ff, #eef8ff);
        color: #1f2a37;
      }
      main {
        width: min(100%, 440px);
        padding: 42px 34px 34px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 48px rgba(31, 42, 55, 0.13);
      }
      .tag {
        display: inline-block;
        margin-bottom: 20px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #dfeeff;
        color: #214a8f;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      h1 { margin: 0 0 8px; color: #1d3557; font-size: 2rem; }
      .description { margin: 0 0 28px; color: #64748b; line-height: 1.65; }
      label { display: block; margin: 18px 0 8px; color: #334155; font-size: 0.92rem; font-weight: 700; }
      input {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid #d5deeb;
        border-radius: 10px;
        background: #fbfdff;
        color: #1f2a37;
        font: inherit;
      }
      input::placeholder { color: #a0aec0; }
      .login-button {
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 50px;
        margin-top: 26px;
        border-radius: 10px;
        background: #1d3557;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }
      .login-button:hover { background: #214a8f; transform: translateY(-1px); }
      .note { margin: 18px 0 0; color: #94a3b8; font-size: 0.82rem; text-align: center; }
      @media (max-width: 480px) { main { padding: 34px 24px 28px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">창일교회 청소년부</div>
      <h1>로그인</h1>
      <p class="description">청소년부 페이지에 오신 것을 환영합니다.</p>
      <label for="user-id">아이디</label>
      <input id="user-id" type="text" placeholder="아이디를 입력해 주세요" autocomplete="username" />
      <label for="password">비밀번호</label>
      <input id="password" type="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" />
      <a class="login-button" href="main.html">로그인</a>
      <p class="note">현재는 화면 확인용 페이지입니다.</p>
    </main>
  </body>
</html>
