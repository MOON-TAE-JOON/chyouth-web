<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d3557" />
    <title>창일교회 청소년부</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: linear-gradient(135deg, #f3f7ff, #eef8ff);
        color: #1f2a37;
      }
      main {
        width: min(100%, 760px);
        padding: clamp(32px, 7vw, 56px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 48px rgba(31, 42, 55, 0.12);
        text-align: center;
      }
      .tag {
        display: inline-block;
        margin-bottom: 20px;
        padding: 9px 16px;
        border-radius: 999px;
        background: #dfeeff;
        color: #214a8f;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      h1 {
        margin: 0 0 20px;
        color: #1d3557;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.25;
      }
      p {
        max-width: 580px;
        margin: 0 auto;
        color: #334155;
        font-size: clamp(1rem, 2.5vw, 1.12rem);
        line-height: 1.9;
        word-break: keep-all;
      }
      .welcome {
        margin-top: 28px;
        color: #64748b;
        font-size: 0.95rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">창일교회 청소년부</div>
      <h1>함께 예배하고,<br />사랑으로 자라나요</h1>
      <p>
        사랑하는 청소년 여러분, 창일교회 청소년부에 오신 것을 환영합니다.
        함께 예배하며 하나님의 사랑을 배우고, 서로를 아끼며 믿음 안에서
        성장하는 공동체를 만들어 갑니다.
      </p>
      <div class="welcome">여러분과 함께할 시간을 기대합니다.</div>
    </main>
  </body>
</html>
