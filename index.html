<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d3557" />
    <title>로그인 | 창일교회 청소년부</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: linear-gradient(135deg, #f3f7ff, #eef8ff);
        color: #1f2a37;
      }
      main {
        width: min(100%, 440px);
        padding: 42px 34px 34px;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 48px rgba(31, 42, 55, 0.13);
      }
      .tag {
        display: inline-block;
        margin-bottom: 20px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #dfeeff;
        color: #214a8f;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      h1 { margin: 0 0 8px; color: #1d3557; font-size: 2rem; }
      .description { margin: 0 0 28px; color: #64748b; line-height: 1.65; }
      label { display: block; margin: 18px 0 8px; color: #334155; font-size: 0.92rem; font-weight: 700; }
      input {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid #d5deeb;
        border-radius: 10px;
        background: #fbfdff;
        color: #1f2a37;
        font: inherit;
      }
      input:focus { outline: 3px solid #bfdbfe; border-color: #3b82f6; }
      .login-button {
        width: 100%;
        min-height: 50px;
        margin-top: 26px;
        border: 0;
        border-radius: 10px;
        background: #1d3557;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .login-button:hover { background: #214a8f; }
      .login-button:disabled { cursor: wait; opacity: 0.7; }
      .message { min-height: 1.5em; margin: 14px 0 0; color: #b42318; font-size: 0.9rem; }
      @media (max-width: 480px) { main { padding: 34px 24px 28px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">창일교회 청소년부</div>
      <h1>로그인</h1>
      <p class="description">청소년부 페이지에 오신 것을 환영합니다.</p>
      <form id="login-form">
        <label for="user-id">아이디</label>
        <input id="user-id" name="hp" type="text" placeholder="아이디를 입력해 주세요" autocomplete="username" required />
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required />
        <button class="login-button" id="login-button" type="submit">로그인</button>
        <p class="message" id="message" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.getElementById('login-form');
      const button = document.getElementById('login-button');
      const message = document.getElementById('message');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        message.textContent = '';
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hp: form.elements.hp.value, password: form.elements.password.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '로그인에 실패했습니다.');
          window.location.assign('/main.html');
        } catch (error) {
          message.textContent = error.message || '로그인 중 오류가 발생했습니다.';
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
